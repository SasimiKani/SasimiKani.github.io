<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Athletic Stage Prototype</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101217;
    font-family: system-ui, sans-serif;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
  }

  #info {
    position: fixed;
    left: 12px;
    top: 12px;
    padding: 8px 10px;
    color: white;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    pointer-events: none;
    user-select: none;
  }

  #status {
    position: fixed;
    left: 12px;
    bottom: 12px;
    color: rgba(255,255,255,0.9);
    font-size: 13px;
    pointer-events: none;
    user-select: none;
  }

  #goalMessage {
    position: fixed;
    left: 50%;
    top: 28%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgb(255, 225, 100);
    font-size: 48px;
    font-weight: 800;
    line-height: 1.05;
    text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    pointer-events: none;
    user-select: none;
    display: none;
  }

  #goalMessage small {
    display: block;
    margin-top: 8px;
    color: rgba(255,255,255,0.94);
    font-size: 16px;
    font-weight: 500;
  }

  #resetButton {
    position: fixed;
    right: 12px;
    top: 12px;
    min-width: 92px;
    min-height: 42px;
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 8px;
    background: rgba(0,0,0,0.55);
    color: white;
    font: inherit;
    cursor: pointer;
  }

  #resetButton:hover {
    background: rgba(255,255,255,0.12);
  }

  #resetButton:focus-visible {
    outline: 2px solid white;
    outline-offset: 2px;
  }

  #stageControls {
    position: fixed;
    right: 116px;
    top: 12px;
    min-height: 42px;
    padding: 6px 10px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    background: rgba(0,0,0,0.55);
    color: white;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }

  #stageSelect {
    min-height: 30px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    background: #20242c;
    color: white;
    padding: 3px 8px;
    font: inherit;
  }

  #stageSelect:focus-visible {
    outline: 2px solid white;
    outline-offset: 2px;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>

<div id="info">
  ↑ ↓ ← → : 移動<br>
  Z : ジャンプ（離すと上昇を急減速）<br>
  Q / E : カメラ左右回転<br>
  W / S : 見上げ / 見下ろし<br>
  R / F : ズームイン / ズームアウト<br>
  カメラ操作 : ほぼ一定速度＋開始/停止だけ短く滑らか<br>青緑 = リフト（側面接触で押される） / 橙系 = 乗ると落ちる足場<br>  曲面フィールド = 一枚の連続地形メッシュ<br>
  <span id="stageDescription">テストステージ : 曲面足場を含む高さ方向の複数ルートアスレチック</span><br>閉じたポリゴン立体・上下挟み込み保護
</div>

<div id="status"></div>
<div id="goalMessage">GOAL!<small id="goalDetail">TEST STAGE</small></div>

<div id="stageControls">
  <label for="stageSelect">ステージ</label>
  <select id="stageSelect">
    <option value="test">テストステージ</option>
    <option value="horizontal">水平アスレチック</option>
    <option value="curvedField">曲面フィールド</option>
  </select>
</div>

<button id="resetButton" type="button">リセット</button>

<script>
(() => {
  "use strict";

  // =========================================================
  // Canvas
  // =========================================================

  const canvas = document.getElementById("game");
  const gl = canvas.getContext("webgl2", {
    antialias: true,
    depth: true,
    alpha: false
  });

  if (!gl) {
    throw new Error("このブラウザではWebGL2を利用できない");
  }

  const statusEl = document.getElementById("status");
  const goalMessageEl = document.getElementById("goalMessage");
  const goalDetailEl = document.getElementById("goalDetail");
  const resetButton = document.getElementById("resetButton");
  const stageSelect = document.getElementById("stageSelect");
  const stageDescriptionEl = document.getElementById("stageDescription");

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  addEventListener("resize", resize);
  resize();

  canvas.focus();

  canvas.addEventListener("pointerdown", () => {
    canvas.focus();
  });

  // =========================================================
  // 入力
  // =========================================================

  const keys = new Set();

  function normalizeKey(e) {
    if (e.key === "ArrowUp") return "ArrowUp";
    if (e.key === "ArrowDown") return "ArrowDown";
    if (e.key === "ArrowLeft") return "ArrowLeft";
    if (e.key === "ArrowRight") return "ArrowRight";

    if (e.key === "z" || e.key === "Z") return "KeyZ";
    if (e.key === "q" || e.key === "Q") return "KeyQ";
    if (e.key === "e" || e.key === "E") return "KeyE";
    if (e.key === "w" || e.key === "W") return "KeyW";
    if (e.key === "s" || e.key === "S") return "KeyS";
    if (e.key === "r" || e.key === "R") return "KeyR";
    if (e.key === "f" || e.key === "F") return "KeyF";

    return e.code;
  }

  document.addEventListener("keydown", e => {
    const key = normalizeKey(e);

    if (
      key === "ArrowUp" ||
      key === "ArrowDown" ||
      key === "ArrowLeft" ||
      key === "ArrowRight" ||
      key === "KeyZ" ||
      key === "KeyQ" ||
      key === "KeyE" ||
      key === "KeyW" ||
      key === "KeyS" ||
      key === "KeyR" ||
      key === "KeyF"
    ) {
      e.preventDefault();
      keys.add(key);
    }
  });

  document.addEventListener("keyup", e => {
    keys.delete(normalizeKey(e));
  });

  addEventListener("blur", () => {
    keys.clear();
  });

  // =========================================================
  // Utility
  // =========================================================

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function approachValue(current, target, maxDelta) {
    if (current < target) {
      return Math.min(current + maxDelta, target);
    }

    if (current > target) {
      return Math.max(current - maxDelta, target);
    }

    return target;
  }

  function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  function approachAngle(current, target, maxStep) {
    let diff = normalizeAngle(target - current);
    diff = clamp(diff, -maxStep, maxStep);
    return normalizeAngle(current + diff);
  }

  function hypot2(x, z) {
    return Math.hypot(x, z);
  }

  // =========================================================
  // 3Dオブジェクト
  // =========================================================

  function createBox(x, y, z, w, h, d, color, solid = true) {
    return {
      x, y, z,
      w, h, d,
      color,
      solid
    };
  }


  // =========================================================
  // 三角ポリゴンメッシュ
  //
  // vertices  : [[x,y,z], ...] のローカル頂点
  // triangles : [[i0,i1,i2], ...] の頂点番号
  //
  // 三角形の頂点順は、外側から見て反時計回り(CCW)を基本にする
  // 同じ三角形を描画と当たり判定の両方に使う
  // =========================================================

  function vec3Sub(a, b) {
    return {
      x: a.x - b.x,
      y: a.y - b.y,
      z: a.z - b.z
    };
  }

  function vec3Cross(a, b) {
    return {
      x: a.y * b.z - a.z * b.y,
      y: a.z * b.x - a.x * b.z,
      z: a.x * b.y - a.y * b.x
    };
  }

  function vec3Dot(a, b) {
    return a.x * b.x + a.y * b.y + a.z * b.z;
  }

  function vec3Length(v) {
    return Math.hypot(v.x, v.y, v.z);
  }

  function vec3Normalize(v) {
    const len = vec3Length(v) || 1;

    return {
      x: v.x / len,
      y: v.y / len,
      z: v.z / len
    };
  }

  function transformMeshVertex(mesh, vertex) {
    const c = Math.cos(mesh.yaw);
    const s = Math.sin(mesh.yaw);

    const sx = vertex[0] * mesh.scaleX;
    const sy = vertex[1] * mesh.scaleY;
    const sz = vertex[2] * mesh.scaleZ;

    return {
      x: mesh.x + sx * c - sz * s,
      y: mesh.y + sy,
      z: mesh.z + sx * s + sz * c
    };
  }

  function rebuildMeshTriangles(mesh) {
    mesh.worldVertices =
      mesh.vertices.map(v => transformMeshVertex(mesh, v));

    mesh.worldTriangles = [];

    let minX = Infinity;
    let minY = Infinity;
    let minZ = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;
    let maxZ = -Infinity;

    let centerX = 0;
    let centerY = 0;
    let centerZ = 0;

    for (const v of mesh.worldVertices) {
      minX = Math.min(minX, v.x);
      minY = Math.min(minY, v.y);
      minZ = Math.min(minZ, v.z);
      maxX = Math.max(maxX, v.x);
      maxY = Math.max(maxY, v.y);
      maxZ = Math.max(maxZ, v.z);

      centerX += v.x;
      centerY += v.y;
      centerZ += v.z;
    }

    const vertexCount =
      Math.max(1, mesh.worldVertices.length);

    mesh.center = {
      x: centerX / vertexCount,
      y: centerY / vertexCount,
      z: centerZ / vertexCount
    };

    mesh.bounds = {
      minX, minY, minZ,
      maxX, maxY, maxZ
    };

    for (const indices of mesh.triangles) {
      let a =
        mesh.worldVertices[indices[0]];

      let b =
        mesh.worldVertices[indices[1]];

      let c =
        mesh.worldVertices[indices[2]];

      let center = {
        x: (a.x + b.x + c.x) / 3,
        y: (a.y + b.y + c.y) / 3,
        z: (a.z + b.z + c.z) / 3
      };

      let ab = vec3Sub(b, a);
      let ac = vec3Sub(c, a);

      let normal =
        vec3Normalize(
          vec3Cross(ab, ac)
        );

      // -----------------------------------------------------
      // 閉じた立体では法線を必ず外向きに固定する
      //
      // これにより
      //   上面  -> +Y
      //   底面  -> -Y
      //   側面  -> 外側
      //
      // という意味を衝突判定でも保持できる
      // -----------------------------------------------------

      if (
        mesh.closedSolid &&
        !mesh.preserveWinding
      ) {
        const fromMeshCenter = {
          x: center.x - mesh.center.x,
          y: center.y - mesh.center.y,
          z: center.z - mesh.center.z
        };

        if (
          vec3Dot(
            normal,
            fromMeshCenter
          ) < 0
        ) {
          // 頂点順を反転
          const temp = b;
          b = c;
          c = temp;

          ab = vec3Sub(b, a);
          ac = vec3Sub(c, a);

          normal =
            vec3Normalize(
              vec3Cross(ab, ac)
            );

          center = {
            x: (a.x + b.x + c.x) / 3,
            y: (a.y + b.y + c.y) / 3,
            z: (a.z + b.z + c.z) / 3
          };
        }
      }

      const triangle = {
        a, b, c,

        // 面固有の外向き法線
        normal,

        center,

        bounds: {
          minX: Math.min(a.x, b.x, c.x),
          minY: Math.min(a.y, b.y, c.y),
          minZ: Math.min(a.z, b.z, c.z),
          maxX: Math.max(a.x, b.x, c.x),
          maxY: Math.max(a.y, b.y, c.y),
          maxZ: Math.max(a.z, b.z, c.z)
        }
      };

      mesh.worldTriangles.push(triangle);
    }
  }

  function createTriMesh(
    x,
    y,
    z,
    vertices,
    triangles,
    color,
    solid = true,
    yaw = 0,
    scaleX = 1,
    scaleY = 1,
    scaleZ = 1
  ) {
    const mesh = {
      type: "mesh",
      x, y, z,
      yaw,
      scaleX,
      scaleY,
      scaleZ,
      vertices,
      triangles,
      color,
      solid,

      // 足場・障害物は閉じた立体として扱う
      // 底面・側面・上面すべてが衝突面になる
      closedSolid: solid,

      gpu: null,
      worldVertices: [],
      worldTriangles: [],
      bounds: null,
      center: null
    };

    rebuildMeshTriangles(mesh);
    return mesh;
  }

  // 斜面を持つ三角柱
  // lowZ側ではなく +Z側が低く、-Z側が高い
  function createWedgeMesh(x, y, z, w, d, h, color, yaw = 0) {
    const hw = w / 2;
    const hd = d / 2;

    const vertices = [
      [-hw, 0,  hd], // 0 低い側 左
      [ hw, 0,  hd], // 1 低い側 右
      [-hw, h, -hd], // 2 高い側 左
      [ hw, h, -hd], // 3 高い側 右
      [-hw, 0, -hd], // 4 底面 奥左
      [ hw, 0, -hd]  // 5 底面 奥右
    ];

    const triangles = [
      // 斜面
      [0, 1, 3],
      [0, 3, 2],

      // 底面
      [0, 4, 5],
      [0, 5, 1],

      // 高い側の垂直面
      [4, 2, 3],
      [4, 3, 5],

      // 左右の三角面
      [0, 2, 4],
      [1, 5, 3]
    ];

    return createTriMesh(
      x, y, z,
      vertices,
      triangles,
      color,
      true,
      yaw
    );
  }


  // 凸多角形をそのまま押し出して足場にする
  // polygon は [[x,z], ...] を上から見て時計回りに並べる
  function createPolygonPlatform(
    x,
    topY,
    z,
    polygon,
    thickness,
    color,
    yaw = 0
  ) {
    const bottomY = -thickness;
    const vertices = [];

    // bottom vertices
    for (const [px, pz] of polygon) {
      vertices.push([px, bottomY, pz]);
    }

    // top vertices
    for (const [px, pz] of polygon) {
      vertices.push([px, 0, pz]);
    }

    const n = polygon.length;
    const triangles = [];

    // top: +Y normal
    for (let i = 1; i < n - 1; i++) {
      triangles.push([
        n,
        n + i,
        n + i + 1
      ]);
    }

    // bottom: -Y normal
    for (let i = 1; i < n - 1; i++) {
      triangles.push([
        0,
        i + 1,
        i
      ]);
    }

    // sides
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;

      triangles.push([
        i,
        j,
        n + j
      ]);

      triangles.push([
        i,
        n + j,
        n + i
      ]);
    }

    return createTriMesh(
      x,
      topY,
      z,
      vertices,
      triangles,
      color,
      true,
      yaw
    );
  }

  function createTrianglePlatform(
    x, topY, z,
    w, d,
    thickness,
    color,
    yaw = 0
  ) {
    return createPolygonPlatform(
      x,
      topY,
      z,
      [
        [-w / 2, -d / 2],
        [ 0,       d / 2],
        [ w / 2,  -d / 2]
      ],
      thickness,
      color,
      yaw
    );
  }

  function createTrapezoidPlatform(
    x, topY, z,
    frontW,
    backW,
    d,
    thickness,
    color,
    yaw = 0
  ) {
    return createPolygonPlatform(
      x,
      topY,
      z,
      [
        [-backW / 2, -d / 2],
        [-frontW / 2, d / 2],
        [ frontW / 2, d / 2],
        [ backW / 2, -d / 2]
      ],
      thickness,
      color,
      yaw
    );
  }

  function createHexPlatform(
    x, topY, z,
    radiusX,
    radiusZ,
    thickness,
    color,
    yaw = 0
  ) {
    const polygon = [];

    // 時計回り
    for (let i = 0; i < 6; i++) {
      const a =
        -Math.PI / 2 -
        i * Math.PI / 3;

      polygon.push([
        Math.cos(a) * radiusX,
        Math.sin(a) * radiusZ
      ]);
    }

    return createPolygonPlatform(
      x,
      topY,
      z,
      polygon,
      thickness,
      color,
      yaw
    );
  }

  function createDiamondPlatform(
    x, topY, z,
    w, d,
    thickness,
    color,
    yaw = 0
  ) {
    return createPolygonPlatform(
      x,
      topY,
      z,
      [
        [ 0,      -d / 2],
        [-w / 2,   0],
        [ 0,       d / 2],
        [ w / 2,   0]
      ],
      thickness,
      color,
      yaw
    );
  }

  // 4隅の高さが違う、少しねじれた足場
  function createTwistedPlatform(
    x,
    baseTopY,
    z,
    w,
    d,
    heights,
    thickness,
    color,
    yaw = 0
  ) {
    const hw = w / 2;
    const hd = d / 2;

    const top = [
      [-hw, heights[0], -hd],
      [-hw, heights[1],  hd],
      [ hw, heights[2],  hd],
      [ hw, heights[3], -hd]
    ];

    const vertices = [
      [top[0][0], top[0][1] - thickness, top[0][2]],
      [top[1][0], top[1][1] - thickness, top[1][2]],
      [top[2][0], top[2][1] - thickness, top[2][2]],
      [top[3][0], top[3][1] - thickness, top[3][2]],

      top[0],
      top[1],
      top[2],
      top[3]
    ];

    const triangles = [
      // top
      [4, 5, 6],
      [4, 6, 7],

      // bottom
      [0, 2, 1],
      [0, 3, 2],

      // sides
      [0, 1, 5], [0, 5, 4],
      [1, 2, 6], [1, 6, 5],
      [2, 3, 7], [2, 7, 6],
      [3, 0, 4], [3, 4, 7]
    ];

    return createTriMesh(
      x,
      baseTopY,
      z,
      vertices,
      triangles,
      color,
      true,
      yaw
    );
  }

  const PLAYER_START = {
    x: -11.5,
    y: 0.75,
    z: 16.4,
    angle: 0
  };

  const player = createBox(
    PLAYER_START.x,
    PLAYER_START.y,
    PLAYER_START.z,
    1.2, 1.5, 1.2,
    "#ffcf4d",
    true
  );

  // 水平速度
  player.vx = 0;
  player.vz = 0;

  // 向き
  // 0 = -Z方向
  player.angle = 0;

  // 地上移動
  player.groundAcceleration = 20.0;
  player.groundDeceleration = 24.0;
  player.groundMaxSpeed = 7.2;
  player.groundTurnSpeed = 7.0;

  // 空中制御
  player.airAcceleration = 2.8;
  player.airMaxSpeed = 7.6;
  player.airTurnSpeed = 1.6;
  player.airDrag = 0.18;

  // 強い逆入力時の減速
  player.reverseBrake = 28.0;

  // 三角ポリゴンは厚み0の面なので、
  // 高速移動時に1フレームで飛び越えないよう
  // 移動をこの距離以下のサブステップへ分割する
  player.collisionStep = 0.08;

  // ジャンプ
  player.verticalSpeed = 0;
  player.isGrounded = true;

  // =======================================================
  // ジャンプ
  //
  // 1. ジャンプ開始時にだけ上向き初速を与える
  // 2. その後は常に重力で上昇速度が減っていく
  // 3. Zを離した瞬間、まだ上昇中なら速度を急減衰させる
  // 4. 頂点を越えると自然に落下
  // =======================================================

  // ジャンプ開始時の上向き初速
  player.jumpInitialSpeed = 10.5;

  // 常に掛かる重力加速度
  player.gravity = 21.0;

  // Zを離したとき、上昇速度をこの割合まで一気に落とす
  // 0.35 = 残り35%
  player.jumpReleaseVelocityMultiplier = 0.35;

  // 落下速度の上限
  player.maxFallSpeed = 16.0;

  // 念のための最大上昇量
  player.maxJumpRise = 4.1;

  player.jumpStartY = player.y;

  // ジャンプ中にZを一度離したか
  player.jumpReleased = false;

  // 最大高度到達後、Zを離すまで再ジャンプを禁止
  player.jumpLocked = false;

  // 着地直後に地上加速で水平速度が跳ねないよう、
  // 次の水平更新1回だけ空中速度をそのまま保存する
  player.justLanded = false;

  // =========================================================
  // フィールド
  // =========================================================

  const ground = createBox(
    0, -0.5, 0,
    48, 1, 48,
    "#56654d",
    true
  );

  // 足場の高さは「上面」の高さで考える
  // 厚み0.8なので centerY = topY - 0.4
  function platform(x, topY, z, w, d, color = "#7187a6") {
    return createBox(
      x,
      topY - 0.4,
      z,
      w,
      0.8,
      d,
      color,
      true
    );
  }

  // =========================================================

  function createDynamicPlatform(
    x,
    topY,
    z,
    w,
    d,
    color
  ) {
    const box =
      createBox(
        x,
        topY - 0.3,
        z,
        w,
        0.6,
        d,
        color,
        true
      );

    box.visible = true;

    box.startX = box.x;
    box.startY = box.y;
    box.startZ = box.z;

    return box;
  }

  function createLiftPlatform(
    x,
    topY,
    z,
    w,
    d,
    color,
    axis,
    range,
    speed,
    startOffset = 0
  ) {
    const box =
      createDynamicPlatform(
        x,
        topY,
        z,
        w,
        d,
        color
      );

    box.dynamicType = "lift";

    box.motionAxis = axis;
    box.motionRange = range;
    box.motionSpeed = speed;

    box.motionOffset =
      clamp(
        startOffset,
        -range,
        range
      );

    box.initialMotionOffset =
      box.motionOffset;

    box.motionDirection = 1;

    if (axis === "x") {
      box.x =
        box.startX +
        box.motionOffset;
    }

    if (axis === "y") {
      box.y =
        box.startY +
        box.motionOffset;
    }

    if (axis === "z") {
      box.z =
        box.startZ +
        box.motionOffset;
    }

    return box;
  }

    box.triggerDelay =

    box.fallGravity = 15.0;
    box.removeDistance = 15.0;

    return box;
  }

  const HORIZONTAL_SPREAD = 1.28;

  function spreadXZ(x, z) {
    return {
      x: x * HORIZONTAL_SPREAD,
      z: z * HORIZONTAL_SPREAD
    };
  }

  function applyHorizontalSpread() {
    // プレイヤー開始地点
    const start =
      spreadXZ(
        PLAYER_START.x,
        PLAYER_START.z
      );

    PLAYER_START.x = start.x;
    PLAYER_START.z = start.z;

    player.x = PLAYER_START.x;
    player.z = PLAYER_START.z;

    // ゴール
    const goalPos =
      spreadXZ(
        goalPlatform.x,
        goalPlatform.z
      );

    goalPlatform.x = goalPos.x;
    goalPlatform.z = goalPos.z;

    // 三角ポリゴン系足場
    for (const mesh of meshObjects) {
      const p =
        spreadXZ(
          mesh.x,
          mesh.z
        );

      mesh.x = p.x;
      mesh.z = p.z;

      // 衝突用のワールド三角形を再計算
      rebuildMeshTriangles(mesh);
    }

    // 動的足場
    for (const platform of dynamicPlatforms) {
      const p =
        spreadXZ(
          platform.startX,
          platform.startZ
        );

      platform.startX = p.x;
      platform.startZ = p.z;

      platform.x = p.x;
      platform.z = p.z;

      // リフトの移動量も少し広げる
      if (
        platform.dynamicType === "lift" &&
        (
          platform.motionAxis === "x" ||
          platform.motionAxis === "z"
        )
      ) {
        platform.motionRange *= 1.18;
        platform.motionOffset *= 1.18;
        platform.initialMotionOffset *= 1.18;

        platform[
          platform.motionAxis
        ] +=
          platform.motionOffset;
      }
    }
  }

  // =========================================================
  // 曲面足場
  //
  // WebGLでは細かい三角形へ分割して曲面を近似する
  // 衝突判定も同じ三角形を使うので、見た目と当たり判定が一致する
  // =========================================================

  function createCurvedHumpPlatform(
    x,
    baseY,
    z,
    length,
    width,
    rise,
    thickness,
    color,
    yaw = 0,
    segments = 12
  ) {
    const vertices = [];
    const triangles = [];

    // X方向へ進む丸い丘
    // topY = sin(0..PI) で中央が最も高い
    for (let i = 0; i <= segments; i++) {
      const t = i / segments;

      const px =
        -length / 2 +
        length * t;

      const topY =
        thickness +
        Math.sin(
          t * Math.PI
        ) * rise;

      vertices.push(
        [px, topY, -width / 2],
        [px, topY,  width / 2],
        [px, 0,    -width / 2],
        [px, 0,     width / 2]
      );
    }

    for (let i = 0; i < segments; i++) {
      const a = i * 4;
      const b = (i + 1) * 4;

      // 上面
      triangles.push(
        [a + 0, b + 0, b + 1],
        [a + 0, b + 1, a + 1]
      );

      // 底面
      triangles.push(
        [a + 2, b + 3, b + 2],
        [a + 2, a + 3, b + 3]
      );

      // 左側面
      triangles.push(
        [a + 0, a + 2, b + 2],
        [a + 0, b + 2, b + 0]
      );

      // 右側面
      triangles.push(
        [a + 1, b + 3, a + 3],
        [a + 1, b + 1, b + 3]
      );
    }

    const last =
      segments * 4;

    // 前後端
    triangles.push(
      [0, 3, 2],
      [0, 1, 3],

      [last + 0, last + 2, last + 3],
      [last + 0, last + 3, last + 1]
    );

    return createTriMesh(
      x,
      baseY,
      z,
      vertices,
      triangles,
      color,
      true,
      yaw
    );
  }

  function createCurvedRampPlatform(
    x,
    baseY,
    z,
    length,
    width,
    rise,
    thickness,
    color,
    yaw = 0,
    segments = 12
  ) {
    const vertices = [];
    const triangles = [];

    // 緩やかに寝て始まり、寝て終わるS字寄りの上り坂
    // smoothstepで高さだけ曲線的に変化させる
    for (let i = 0; i <= segments; i++) {
      const t =
        i / segments;

      const smooth =
        t * t *
        (3 - 2 * t);

      const px =
        -length / 2 +
        length * t;

      const topY =
        thickness +
        rise * smooth;

      vertices.push(
        [px, topY, -width / 2],
        [px, topY,  width / 2],
        [px, 0,    -width / 2],
        [px, 0,     width / 2]
      );
    }

    for (let i = 0; i < segments; i++) {
      const a = i * 4;
      const b = (i + 1) * 4;

      triangles.push(
        // 上
        [a + 0, b + 0, b + 1],
        [a + 0, b + 1, a + 1],

        // 下
        [a + 2, b + 3, b + 2],
        [a + 2, a + 3, b + 3],

        // 左
        [a + 0, a + 2, b + 2],
        [a + 0, b + 2, b + 0],

        // 右
        [a + 1, b + 3, a + 3],
        [a + 1, b + 1, b + 3]
      );
    }

    const last =
      segments * 4;

    triangles.push(
      [0, 3, 2],
      [0, 1, 3],

      [last + 0, last + 2, last + 3],
      [last + 0, last + 3, last + 1]
    );

    return createTriMesh(
      x,
      baseY,
      z,
      vertices,
      triangles,
      color,
      true,
      yaw
    );
  }

  function createArchedBridgePlatform(
    x,
    baseY,
    z,
    length,
    width,
    archRise,
    thickness,
    color,
    yaw = 0,
    segments = 16
  ) {
    const vertices = [];
    const triangles = [];

    // 中央が丸く持ち上がる橋
    // 丘型より細長くして「橋」として使う
    for (let i = 0; i <= segments; i++) {
      const t =
        i / segments;

      const px =
        -length / 2 +
        length * t;

      const curve =
        (1 - Math.cos(
          t * Math.PI * 2
        )) * 0.5;

      const topY =
        thickness +
        archRise * curve;

      const bottomY =
        Math.max(
          0,
          topY - thickness
        );

      vertices.push(
        [px, topY,    -width / 2],
        [px, topY,     width / 2],
        [px, bottomY, -width / 2],
        [px, bottomY,  width / 2]
      );
    }

    for (let i = 0; i < segments; i++) {
      const a = i * 4;
      const b = (i + 1) * 4;

      triangles.push(
        [a + 0, b + 0, b + 1],
        [a + 0, b + 1, a + 1],

        [a + 2, b + 3, b + 2],
        [a + 2, a + 3, b + 3],

        [a + 0, a + 2, b + 2],
        [a + 0, b + 2, b + 0],

        [a + 1, b + 3, a + 3],
        [a + 1, b + 1, b + 3]
      );
    }

    const last =
      segments * 4;

    triangles.push(
      [0, 3, 2],
      [0, 1, 3],

      [last + 0, last + 2, last + 3],
      [last + 0, last + 3, last + 1]
    );

    return createTriMesh(
      x,
      baseY,
      z,
      vertices,
      triangles,
      color,
      true,
      yaw
    );
  }

  // =========================================================
  // 曲面フィールド
  //
  // 1枚の大きな高さフィールドを閉じた三角メッシュとして生成
  // 見た目と当たり判定は同じポリゴンを使用
  // =========================================================

  function fieldSmooth(t) {
    const v = clamp(t, 0, 1);
    return v * v * (3 - 2 * v);
  }

  function fieldGaussian(
    x, z,
    cx, cz,
    sx, sz
  ) {
    const dx = (x - cx) / sx;
    const dz = (z - cz) / sz;

    return Math.exp(
      -0.5 * (
        dx * dx +
        dz * dz
      )
    );
  }

  function curvedFieldHeight(x, z) {
    // 全体の細かなうねり
    let h =
      0.9 +
      Math.sin((x + 48) * 0.10) * 0.42 +
      Math.cos(z * 0.14) * 0.34;

    // 前半の大きな丘
    h +=
      4.9 *
      fieldGaussian(
        x, z,
        -27, 8,
        15, 13
      );

    // 丘と丘の間の鞍部
    h -=
      2.2 *
      fieldGaussian(
        x, z,
        -14, -5,
        12, 10
      );

    // 南側の別ルートになる高まり
    h +=
      3.15 *
      fieldGaussian(
        x, z,
        -17, 20,
        15, 10
      );

    // -------------------------------------------------------
    // 中央の曲がった谷
    // 中心線が低く、左右がなだらかにせり上がる
    // -------------------------------------------------------

    const channelWindow =
      fieldSmooth(
        (x + 10) / 10
      ) *
      (
        1 -
        fieldSmooth(
          (x - 27) / 9
        )
      );

    const channelCenterZ =
      -3 +
      Math.sin(
        (x + 8) * 0.10
      ) * 6.5;

    const channelSides =
      1 -
      Math.exp(
        -Math.pow(
          (z - channelCenterZ) / 9,
          2
        )
      );

    h +=
      channelWindow *
      channelSides *
      2.85;

    h +=
      channelWindow *
      Math.sin(
        (x + 4) * 0.18
      ) * 0.62;

    // -------------------------------------------------------
    // 中盤のすり鉢状地形
    // 外周が高く、中央が窪む
    // -------------------------------------------------------

    h +=
      fieldGaussian(
        x, z,
        16, -12,
        16, 14
      ) * 4.0;

    h -=
      fieldGaussian(
        x, z,
        16, -12,
        7.0, 7.0
      ) * 5.2;

    // -------------------------------------------------------
    // 局所的な極端地形
    //
    // フィールド全体の滑らかさは維持しつつ、
    // 一部だけ急に深い溝・鋭いこぶ・クレーター状にする
    // -------------------------------------------------------

    // 斜めに走る細い深溝
    const trenchLine =
      x + 5 -
      (z - 9) * 0.42;

    const trenchLength =
      fieldGaussian(
        x, z,
        -4, 10,
        11, 14
      );

    h -=
      Math.exp(
        -Math.pow(
          trenchLine / 2.4,
          2
        )
      ) *
      trenchLength *
      4.6;

    // 円錐に近い鋭いこぶ
    h +=
      fieldGaussian(
        x, z,
        8, 13,
        3.6, 3.6
      ) * 5.5;

    // 小さなクレーター
    h +=
      fieldGaussian(
        x, z,
        -31, -15,
        7.5, 7.5
      ) * 2.7;

    h -=
      fieldGaussian(
        x, z,
        -31, -15,
        3.4, 3.4
      ) * 5.0;

    // 終盤手前の短い盛り上がり
    h +=
      fieldGaussian(
        x, z,
        28, -20,
        4.5, 3.3
      ) * 4.2;

    // 終盤の尾根
    h +=
      fieldGaussian(
        x, z,
        30, 2,
        14, 9
      ) * 3.1;

    h +=
      fieldGaussian(
        x, z,
        30, 18,
        21, 7.5
      ) * 2.35;

    // ゴール側の大きな丘
    h +=
      fieldGaussian(
        x, z,
        42, -15,
        14, 13
      ) * 5.6;

    // スタート周辺を少し平坦化
    const startDistance =
      Math.hypot(
        (x + 45) / 9,
        (z - 14) / 8
      );

    const startBlend =
      fieldSmooth(
        1 - startDistance
      );

    h =
      h * (1 - startBlend * 0.92) +
      1.15 * startBlend * 0.92;

    // ゴール頂上を少し平坦化
    const goalDistance =
      Math.hypot(
        (x - 44) / 8,
        (z + 15) / 7
      );

    const goalBlend =
      fieldSmooth(
        1 - goalDistance
      );

    h =
      h * (1 - goalBlend * 0.86) +
      7.4 * goalBlend * 0.86;

    return clamp(
      h,
      -2.4,
      10.2
    );
  }

  function createCurvedFieldTerrain(
    width,
    depth,
    segmentsX,
    segmentsZ,
    bottomY,
    color
  ) {
    const vertices = [];
    const triangles = [];

    const cols =
      segmentsX + 1;

    function index(ix, iz) {
      return iz * cols + ix;
    }

    // 上面頂点
    for (
      let iz = 0;
      iz <= segmentsZ;
      iz++
    ) {
      const z =
        -depth / 2 +
        depth *
        (iz / segmentsZ);

      for (
        let ix = 0;
        ix <= segmentsX;
        ix++
      ) {
        const x =
          -width / 2 +
          width *
          (ix / segmentsX);

        vertices.push([
          x,
          curvedFieldHeight(
            x,
            z
          ),
          z
        ]);
      }
    }

    const bottomOffset =
      vertices.length;

    // 底面頂点
    for (
      let iz = 0;
      iz <= segmentsZ;
      iz++
    ) {
      const z =
        -depth / 2 +
        depth *
        (iz / segmentsZ);

      for (
        let ix = 0;
        ix <= segmentsX;
        ix++
      ) {
        const x =
          -width / 2 +
          width *
          (ix / segmentsX);

        vertices.push([
          x,
          bottomY,
          z
        ]);
      }
    }

    // 上面 +Y / 底面 -Y
    for (
      let iz = 0;
      iz < segmentsZ;
      iz++
    ) {
      for (
        let ix = 0;
        ix < segmentsX;
        ix++
      ) {
        const i00 =
          index(ix, iz);

        const i10 =
          index(ix + 1, iz);

        const i01 =
          index(ix, iz + 1);

        const i11 =
          index(ix + 1, iz + 1);

        triangles.push(
          [i00, i11, i10],
          [i00, i01, i11]
        );

        const b00 =
          bottomOffset + i00;

        const b10 =
          bottomOffset + i10;

        const b01 =
          bottomOffset + i01;

        const b11 =
          bottomOffset + i11;

        triangles.push(
          [b00, b10, b11],
          [b00, b11, b01]
        );
      }
    }

    // 北側 -Z
    for (
      let ix = 0;
      ix < segmentsX;
      ix++
    ) {
      const a =
        index(ix, 0);

      const b =
        index(ix + 1, 0);

      const ba =
        bottomOffset + a;

      const bb =
        bottomOffset + b;

      triangles.push(
        [a, bb, ba],
        [a, b, bb]
      );
    }

    // 南側 +Z
    for (
      let ix = 0;
      ix < segmentsX;
      ix++
    ) {
      const a =
        index(ix, segmentsZ);

      const b =
        index(ix + 1, segmentsZ);

      const ba =
        bottomOffset + a;

      const bb =
        bottomOffset + b;

      triangles.push(
        [a, ba, bb],
        [a, bb, b]
      );
    }

    // 西側 -X
    for (
      let iz = 0;
      iz < segmentsZ;
      iz++
    ) {
      const a =
        index(0, iz);

      const b =
        index(0, iz + 1);

      const ba =
        bottomOffset + a;

      const bb =
        bottomOffset + b;

      triangles.push(
        [a, ba, bb],
        [a, bb, b]
      );
    }

    // 東側 +X
    for (
      let iz = 0;
      iz < segmentsZ;
      iz++
    ) {
      const a =
        index(segmentsX, iz);

      const b =
        index(
          segmentsX,
          iz + 1
        );

      const ba =
        bottomOffset + a;

      const bb =
        bottomOffset + b;

      triangles.push(
        [a, bb, ba],
        [a, b, bb]
      );
    }

    const terrain =
      createTriMesh(
        0, 0, 0,
        vertices,
        triangles,
        color,
        true
      );

    // 凹地があるため中心基準の法線補正は使わない
    terrain.preserveWinding =
      true;

    rebuildMeshTriangles(
      terrain
    );

    return terrain;
  }

  function getMeshTopYAtXZ(
    mesh,
    x,
    z
  ) {
    let bestY =
      -Infinity;

    for (
      const triangle
      of mesh.worldTriangles
    ) {
      if (
        triangle.normal.y <= 0.48
      ) {
        continue;
      }

      if (
        !pointInTriangleXZ(
          x,
          z,
          triangle
        )
      ) {
        continue;
      }

      const y =
        triangleYAtXZ(
          triangle,
          x,
          z
        );

      if (
        y !== null
      ) {
        bestY =
          Math.max(
            bestY,
            y
          );
      }
    }

    return Number.isFinite(
      bestY
    )
      ? bestY
      : null;
  }

  function createHexPrismMesh(
    x,
    y,
    z,
    radius,
    height,
    color,
    yaw = 0
  ) {
    const vertices = [];
    const triangles = [];
    const sides = 6;

    for (
      let i = 0;
      i < sides;
      i++
    ) {
      const a =
        Math.PI * 2 *
        i / sides;

      vertices.push([
        Math.cos(a) * radius,
        0,
        Math.sin(a) * radius
      ]);
    }

    for (
      let i = 0;
      i < sides;
      i++
    ) {
      const a =
        Math.PI * 2 *
        i / sides;

      vertices.push([
        Math.cos(a) * radius,
        height,
        Math.sin(a) * radius
      ]);
    }

    // 底面・天面
    for (
      let i = 1;
      i < sides - 1;
      i++
    ) {
      triangles.push(
        [0, i + 1, i],
        [sides, sides + i, sides + i + 1]
      );
    }

    // 側面
    for (
      let i = 0;
      i < sides;
      i++
    ) {
      const n =
        (i + 1) % sides;

      triangles.push(
        [i, n, sides + n],
        [i, sides + n, sides + i]
      );
    }

    return createTriMesh(
      x,
      y,
      z,
      vertices,
      triangles,
      color,
      true,
      yaw
    );
  }

  function createConeMesh(
    x,
    y,
    z,
    radius,
    height,
    color,
    yaw = 0,
    sides = 8
  ) {
    const vertices = [];
    const triangles = [];

    for (
      let i = 0;
      i < sides;
      i++
    ) {
      const a =
        Math.PI * 2 *
        i / sides;

      vertices.push([
        Math.cos(a) * radius,
        0,
        Math.sin(a) * radius
      ]);
    }

    const apex =
      vertices.length;

    vertices.push([
      0,
      height,
      0
    ]);

    // 底面
    for (
      let i = 1;
      i < sides - 1;
      i++
    ) {
      triangles.push(
        [0, i + 1, i]
      );
    }

    // 側面
    for (
      let i = 0;
      i < sides;
      i++
    ) {
      const n =
        (i + 1) % sides;

      triangles.push(
        [i, n, apex]
      );
    }

    return createTriMesh(
      x,
      y,
      z,
      vertices,
      triangles,
      color,
      true,
      yaw
    );
  }

  function isPlayerStandingOnBox(
    box,
    tolerance = 0.10
  ) {
    if (
      !box.solid ||
      box.visible === false
    ) {
      return false;
    }

    const pb =
      getBounds(player);

    const b =
      getBounds(box);

    const horizontalOverlap =
      pb.maxX > b.minX + 0.04 &&
      pb.minX < b.maxX - 0.04 &&
      pb.maxZ > b.minZ + 0.04 &&
      pb.minZ < b.maxZ - 0.04;

    const feetNearTop =
      Math.abs(
        pb.minY -
        b.maxY
      ) <= tolerance;

    return (
      horizontalOverlap &&
      feetNearTop &&
      player.verticalSpeed <= 0.5
    );
  }

  function getAabbOverlap(a, b) {
    const A = getBounds(a);
    const B = getBounds(b);

    return {
      x:
        Math.min(A.maxX, B.maxX) -
        Math.max(A.minX, B.minX),

      y:
        Math.min(A.maxY, B.maxY) -
        Math.max(A.minY, B.minY),

      z:
        Math.min(A.maxZ, B.maxZ) -
        Math.max(A.minZ, B.minZ)
    };
  }

  function isSideContactWithMovingPlatform(
    platform,
    dx,
    dy,
    dz
  ) {
    if (
      dx === 0 &&
      dz === 0
    ) {
      return false;
    }

    const overlap =
      getAabbOverlap(
        player,
        platform
      );

    if (
      overlap.x <= 0 ||
      overlap.y <= 0 ||
      overlap.z <= 0
    ) {
      return false;
    }

    const pb =
      getBounds(player);

    const b =
      getBounds(platform);

    // 上面に乗っているだけなら側面押し出しではない
    const standingOnTop =
      Math.abs(
        pb.minY -
        b.maxY
      ) <= 0.12 &&
      player.verticalSpeed <= 0.5;

    if (standingOnTop) {
      return false;
    }

    return true;
  }

  function pushPlayerByMovingPlatform(
    platform,
    dx,
    dy,
    dz,
    dt
  ) {
    if (
      dx === 0 &&
      dy === 0 &&
      dz === 0
    ) {
      return;
    }

    if (
      !isSideContactWithMovingPlatform(
        platform,
        dx,
        dy,
        dz
      )
    ) {
      return;
    }

    // -------------------------------------------------------
    // 横方向
    //
    // リフトが動いた方向へプレイヤーを押す
    // 通常の moveHorizontal() を通すので、
    // その先に別の壁があればそこで止まる
    // -------------------------------------------------------

    if (
      dx !== 0 ||
      dz !== 0
    ) {
      const oldX =
        player.x;

      const oldZ =
        player.z;

      // 押しているリフト自身だけ一時的に衝突対象から外す
      // 他の壁・足場との衝突はそのまま有効
      const oldSolid =
        platform.solid;

      platform.solid = false;

      moveHorizontal(
        dx,
        dz
      );

      platform.solid =
        oldSolid;

      const movedX =
        player.x - oldX;

      const movedZ =
        player.z - oldZ;

      // リフトの実速度を少し引き継ぐ
      const pushStrength = 0.85;
      const safeDt =
        Math.max(dt, 1 / 240);

      if (
        Math.abs(dx) > 0.00001 &&
        Math.abs(movedX) > 0.00001
      ) {
        player.vx =
          dx / safeDt *
          pushStrength;
      }

      if (
        Math.abs(dz) > 0.00001 &&
        Math.abs(movedZ) > 0.00001
      ) {
        player.vz =
          dz / safeDt *
          pushStrength;
      }
    }

    // -------------------------------------------------------
    // 縦方向
    //
    // 上下リフトの側面に当たった場合は、
    // 下から押し上げられるケースだけ少し持ち上げる
    // 上から押し潰す方向は既存の縦挟み込み保護へ任せる
    // -------------------------------------------------------

    if (dy > 0) {
      const room =
        getVerticalRoomInfo();

      const nextY =
        player.y + dy;

      if (
        !room.hasCeiling ||
        nextY <= room.maxCenterY
      ) {
        player.y =
          nextY;

        stabilizeVerticalRoom();
      }
    }
  }

  function moveLiftPlatform(
    platform,
    dt
  ) {
    const wasStanding =
      isPlayerStandingOnBox(
        platform,
        0.13
      );

    const oldX = platform.x;
    const oldY = platform.y;
    const oldZ = platform.z;

    let nextOffset =
      platform.motionOffset +
      platform.motionDirection *
      platform.motionSpeed *
      dt;

    if (
      nextOffset >
      platform.motionRange
    ) {
      const excess =
        nextOffset -
        platform.motionRange;

      nextOffset =
        platform.motionRange -
        excess;

      platform.motionDirection = -1;
    }

    if (
      nextOffset <
      -platform.motionRange
    ) {
      const excess =
        -platform.motionRange -
        nextOffset;

      nextOffset =
        -platform.motionRange +
        excess;

      platform.motionDirection = 1;
    }

    platform.motionOffset =
      nextOffset;

    platform.x =
      platform.startX;

    platform.y =
      platform.startY;

    platform.z =
      platform.startZ;

    platform[
      platform.motionAxis
    ] += nextOffset;

    const dx =
      platform.x - oldX;

    const dy =
      platform.y - oldY;

    const dz =
      platform.z - oldZ;

    if (wasStanding) {
      // リフトに乗っている間はその移動量だけ運ぶ
      if (
        dx !== 0 ||
        dz !== 0
      ) {
        moveHorizontal(
          dx,
          dz
        );
      }

      if (dy !== 0) {
        player.y += dy;

        stabilizeVerticalRoom();

        player.isGrounded = true;
        player.verticalSpeed = 0;
      }
    } else {
      // 上に乗っていない状態で側面へ接触したら、
      // リフトの移動方向へ押し出す
      pushPlayerByMovingPlatform(
        platform,
        dx,
        dy,
        dz,
        dt
      );
    }
  }

  function moveFallingPlatform(
    platform,
    dt
  ) {
    const wasStanding =
      isPlayerStandingOnBox(
        platform,
        0.13
      );

    const oldY =
      platform.y;

    if (
      platform.fallState ===
      "idle"
    ) {
      platform.color =
        platform.baseColor;

      if (wasStanding) {
        platform.fallState =
          "armed";

        platform.fallTimer = 0;
      }
    }

    if (
      platform.fallState ===
      "armed"
    ) {
      platform.fallTimer +=
        dt;

      platform.color =
        platform.warningColor;

      if (
        platform.fallTimer >=
        platform.triggerDelay
      ) {
        platform.fallState =
          "falling";

        platform.fallTimer = 0;
        platform.fallVelocity = 0;
      }
    }

    if (
      platform.fallState ===
      "falling"
    ) {
      platform.fallVelocity -=
        platform.fallGravity *
        dt;

      platform.y +=
        platform.fallVelocity *
        dt;

      if (
        wasStanding
      ) {
        player.y +=
          platform.y -
          oldY;

        player.isGrounded = true;
      }

      if (
        platform.y <
        platform.startY -
        platform.removeDistance
      ) {
        platform.fallState =
          "respawning";

        platform.fallTimer = 0;

        platform.solid = false;
        platform.visible = false;
      }
    }

    if (
      platform.fallState ===
      "respawning"
    ) {
      platform.fallTimer +=
        dt;

      if (
        platform.fallTimer >=
        platform.respawnDelay
      ) {
        platform.x =
          platform.startX;

        platform.y =
          platform.startY;

        platform.z =
          platform.startZ;

        platform.fallVelocity = 0;
        platform.fallTimer = 0;

        platform.solid = true;
        platform.visible = true;

        platform.color =
          platform.baseColor;

        platform.fallState =
          "idle";
      }
    }
  }
